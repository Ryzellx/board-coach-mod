name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform + build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build release APK (kunci tetap → update tidak bentrok)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature (fingerprint harus selalu sama)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.0.0)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-1" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boardcoach-mod
          path: app/build/outputs/apk/release/app-release.apk
