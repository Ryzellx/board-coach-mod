<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
window.onerror = function(m, s, l) {
  try { BCAndroid.onUci('ERR: ' + m + ' @' + l); } catch (x) {}
};
try {
  var w = new Worker('stockfish.js');
  w.onmessage = function(e) {
    try { BCAndroid.onUci(String(e.data)); } catch (x) {}
  };
  w.onerror = function(e) {
    try { BCAndroid.onUci('ERR: worker ' + (e.message || e)); } catch (x) {}
  };
  window.send = function(c) {
    try { w.postMessage(c); } catch (x) { BCAndroid.onUci('ERR: post ' + x); }
  };
  BCAndroid.onUci('LOG: worker dibuat');
  w.postMessage('uci');
} catch (e) {
  BCAndroid.onUci('ERR: init ' + e);
}
</script>
</body>
</html>
